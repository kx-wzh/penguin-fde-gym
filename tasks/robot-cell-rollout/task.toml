version = "1.0"

[agent]
timeout_sec = 1800
user = "fde-agent"

[verifier]
timeout_sec = 300
user = "root"

[environment]
build_timeout_sec = 900
cpus = 2
memory_mb = 2048
storage_mb = 10240

[environment.healthcheck]
command = "python3 -I /opt/fde-gym-private/harness/harbor_security.py"
retries = 1
