version = "1.0"

[agent]
timeout_sec = 1800
user = "fde-agent"
network_mode = "no-network"

[verifier]
timeout_sec = 300
user = "root"

[environment]
network_mode = "allowlist"
allowed_hosts = ["nodejs.org", "registry.npmjs.org"]
build_timeout_sec = 900
cpus = 2
memory_mb = 2048
storage_mb = 10240

[environment.healthcheck]
command = "python3 -I /opt/fde-gym-private/harness/harbor_security.py"
retries = 1
